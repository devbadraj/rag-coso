[project]
name = "coso-rag"
version = "0.1.0"
description = "A focused construction document assistant with evidence ranking and page citations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pymupdf>=1.26,<2",
  "numpy>=2,<3",
  "sentence-transformers>=5,<7",
  "streamlit>=1.50,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "torch>=2.6,<3",
  "transformers>=5.1,<6",
  "safetensors>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[project.scripts]
coso-rag = "coso_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
